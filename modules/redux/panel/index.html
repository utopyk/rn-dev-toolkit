<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Redux — redux</title>
    <style>
      * { box-sizing: border-box; }
      body {
        margin: 0;
        padding: 16px;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        background: #0f1115;
        color: #e5e7eb;
        font-size: 13px;
        height: 100vh;
        display: flex;
        flex-direction: column;
      }
      h1 { margin: 0; font-size: 15px; font-weight: 600; }
      .bar { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-bottom: 12px; }
      .bar-right { display: flex; gap: 8px; align-items: center; }
      button {
        background: #1f2937; color: #e5e7eb; border: 1px solid #374151;
        padding: 6px 12px; border-radius: 4px; cursor: pointer; font-size: 12px;
      }
      button:hover { background: #374151; }
      button:disabled { opacity: 0.5; cursor: default; }
      .status {
        font-size: 12px; color: #9ca3af; margin-bottom: 10px;
        padding: 8px 12px; background: #1a1d23; border: 1px solid #2a2f38; border-radius: 4px;
      }
      .status-label { color: #6b7280; }
      .status-value { color: #e5e7eb; margin-right: 12px; }
      .status-value--ok { color: #34d399; }
      .status-value--warn { color: #fb923c; }
      .split { display: flex; gap: 12px; flex: 1; min-height: 0; }
      .pane { flex: 1; min-width: 0; display: flex; flex-direction: column; }
      .pane h2 {
        margin: 0 0 6px; font-size: 11px; text-transform: uppercase;
        letter-spacing: 0.04em; color: #9ca3af; font-weight: 600;
      }
      .scroll { overflow: auto; border: 1px solid #1f2937; border-radius: 6px; flex: 1; }
      table { width: 100%; border-collapse: collapse; font-size: 12px; }
      td {
        text-align: left; padding: 5px 8px; border-bottom: 1px solid #1f2937;
        font-family: ui-monospace, SFMono-Regular, monospace; word-break: break-all;
      }
      tr.action-row { cursor: pointer; }
      tr.action-row:hover { background: #1a1d23; }
      tr.action-row.selected { background: #243042; }
      .col-seq { width: 48px; color: #6b7280; }
      .col-type { color: #e5e7eb; }
      .col-time { width: 84px; text-align: right; color: #6b7280; }
      pre {
        margin: 0; padding: 10px; font-family: ui-monospace, SFMono-Regular, monospace;
        font-size: 12px; white-space: pre-wrap; word-break: break-word; color: #cbd5e1;
      }
      .redacted { color: #6b7280; font-style: italic; }
      .empty {
        padding: 24px; text-align: center; color: #9ca3af;
        border: 1px dashed #374151; border-radius: 6px; margin: 8px;
      }
      .error {
        padding: 10px 12px; background: rgba(248, 113, 113, 0.08);
        border: 1px solid rgba(248, 113, 113, 0.25); color: #f87171;
        border-radius: 4px; font-size: 12px;
      }
    </style>
  </head>
  <body>
    <div class="bar">
      <h1>Redux</h1>
      <div class="bar-right">
        <button id="clear">Clear</button>
        <button id="refresh">Refresh</button>
      </div>
    </div>
    <div id="status" class="status" hidden></div>
    <div class="split">
      <div class="pane">
        <h2>Actions</h2>
        <div class="scroll" id="actions"><div class="empty">Loading…</div></div>
      </div>
      <div class="pane">
        <h2 id="detail-title">State</h2>
        <div class="scroll" id="detail"><div class="empty">Loading…</div></div>
      </div>
    </div>
    <script src="./panel.js"></script>
  </body>
</html>
