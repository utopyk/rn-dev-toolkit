<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Redux — redux</title>
    <style>
      /* Mirror of renderer/theme/global.css (soft-dark) so the panel matches
         the app palette. Panels are isolated WebContentsViews and don't
         inherit the renderer's CSS, so the tokens are duplicated here. */
      :root {
        --bg:         #14151E;
        --bg-soft:    #1A1B26;
        --surface:    #1E202B;
        --surface-hi: #262833;
        --ink:        #ECEEF5;
        --ink-soft:   #C5C8D2;
        --muted:      #7D8192;
        --muted-2:    #525668;
        --glow:       #cc97cc;
        --ready:      #2BD96A;
        --booting:    #FFB020;
        --error:      #f7768e;
        /* leaf value type colors */
        --t-string:   #9ece6a;
        --t-number:   #ff9e64;
        --t-bool:     #7aa2f7;
        --t-null:     #7D8192;
        --t-key:      #C5C8D2;
      }
      * { box-sizing: border-box; }
      html, body { height: 100%; }
      body {
        margin: 0;
        padding: 12px;
        font-family: 'SF Mono', 'Fira Code', 'JetBrains Mono', 'Cascadia Code', ui-monospace, SFMono-Regular, monospace;
        background: var(--bg);
        color: var(--ink);
        font-size: 12.5px;
        line-height: 1.5;
        height: 100vh;
        display: flex;
        flex-direction: column;
      }
      ::-webkit-scrollbar { width: 7px; height: 7px; }
      ::-webkit-scrollbar-track { background: transparent; }
      ::-webkit-scrollbar-thumb { background: var(--muted-2); border-radius: 4px; }
      ::-webkit-scrollbar-thumb:hover { background: var(--muted); }

      .bar { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-bottom: 10px; }
      h1 { margin: 0; font-size: 14px; font-weight: 600; letter-spacing: 0.02em; }
      .bar-right { display: flex; gap: 8px; align-items: center; }
      button {
        background: var(--surface); color: var(--ink-soft); border: 1px solid var(--surface-hi);
        padding: 5px 11px; border-radius: 7px; cursor: pointer; font-size: 11.5px; font-family: inherit;
      }
      button:hover { background: var(--surface-hi); color: var(--ink); }
      button:disabled { opacity: 0.5; cursor: default; }
      .toggle { display: flex; align-items: center; gap: 6px; font-size: 11.5px; color: var(--muted); cursor: pointer; user-select: none; }
      .toggle input { accent-color: var(--glow); cursor: pointer; }

      .status {
        font-size: 11.5px; color: var(--muted); margin-bottom: 10px;
        padding: 7px 12px; background: var(--bg-soft); border: 1px solid var(--surface-hi); border-radius: 8px;
        display: flex; gap: 6px; flex-wrap: wrap; align-items: center;
      }
      .status-label { color: var(--muted-2); }
      .status-value { color: var(--ink-soft); margin-right: 12px; }
      .status-value--ok { color: var(--ready); }
      .status-value--warn { color: var(--booting); }

      .split { display: flex; gap: 10px; flex: 1; min-height: 0; }
      .pane { display: flex; flex-direction: column; min-width: 0; min-height: 0; }
      .pane-list { width: 42%; }
      .pane-detail { flex: 1; }
      .pane-head { margin-bottom: 6px; }
      .search {
        width: 100%; background: var(--bg-soft); color: var(--ink); border: 1px solid var(--surface-hi);
        border-radius: 7px; padding: 6px 10px; font-size: 11.5px; font-family: inherit; outline: none;
      }
      .search:focus { border-color: var(--glow); }
      .scroll { overflow: auto; border: 1px solid var(--surface-hi); border-radius: 9px; flex: 1; background: var(--bg-soft); }

      table { width: 100%; border-collapse: collapse; font-size: 12px; }
      td { text-align: left; padding: 5px 9px; border-bottom: 1px solid var(--surface); word-break: break-all; }
      tr.action-row { cursor: pointer; }
      tr.action-row:hover { background: var(--surface); }
      tr.action-row.selected { background: var(--surface-hi); box-shadow: inset 2px 0 0 var(--glow); }
      .col-seq { width: 46px; color: var(--muted-2); }
      .col-type { color: var(--ink); }
      .col-time { width: 90px; text-align: right; color: var(--muted-2); }

      .tabs { display: flex; gap: 2px; margin-bottom: 6px; }
      .tab {
        flex: 0 0 auto; padding: 5px 14px; border-radius: 7px 7px 0 0; border: 1px solid transparent;
        background: transparent; color: var(--muted); font-size: 11.5px;
      }
      .tab:hover { color: var(--ink-soft); }
      .tab.active { color: var(--ink); background: var(--bg-soft); border-color: var(--surface-hi); box-shadow: inset 0 -2px 0 var(--glow); }

      /* JSON tree */
      .tree { padding: 8px 6px; font-size: 12px; }
      .tnode { white-space: nowrap; }
      .trow { display: flex; align-items: baseline; gap: 4px; padding: 1px 0; border-radius: 4px; }
      .trow:hover { background: var(--surface); }
      .tchildren { margin-left: 14px; border-left: 1px solid var(--surface); padding-left: 8px; }
      .ttoggle { width: 12px; flex: 0 0 12px; color: var(--muted); cursor: pointer; user-select: none; text-align: center; }
      .tkey { color: var(--t-key); cursor: pointer; }
      .tcolon { color: var(--muted-2); }
      .tsummary { color: var(--muted); cursor: pointer; }
      .tstring { color: var(--t-string); }
      .tnumber { color: var(--t-number); }
      .tbool { color: var(--t-bool); }
      .tnull { color: var(--t-null); }
      .tredacted { color: var(--error); font-style: italic; }
      .ttype { color: var(--muted); font-style: italic; }
      .thit { background: rgba(204,151,204,0.18); border-radius: 3px; }
      /* diff (old → new) */
      .trow-diff .ttoggle { color: var(--muted); font-weight: 700; }
      .tdel { text-decoration: line-through; opacity: 0.7; color: var(--error) !important; }
      .tadd { color: var(--ready) !important; }
      .tarrow { color: var(--muted); }

      .empty { padding: 22px; text-align: center; color: var(--muted); }
      .error {
        margin: 8px; padding: 10px 12px; background: rgba(247,118,142,0.08);
        border: 1px solid rgba(247,118,142,0.3); color: var(--error); border-radius: 7px; font-size: 12px;
      }
    </style>
  </head>
  <body>
    <div class="bar">
      <h1>Redux</h1>
      <div class="bar-right">
        <label class="toggle" title="Reveal real values (the secret blacklist still masks tokens/email/etc.)">
          <input type="checkbox" id="reveal" checked /> Reveal values
        </label>
        <button id="clear">Clear</button>
        <button id="refresh">Refresh</button>
      </div>
    </div>
    <div id="status" class="status" hidden></div>
    <div class="split">
      <div class="pane pane-list">
        <div class="pane-head"><input id="action-search" class="search" placeholder="Filter actions by type…" /></div>
        <div class="scroll" id="actions"><div class="empty">Loading…</div></div>
      </div>
      <div class="pane pane-detail">
        <div class="tabs" id="tabs">
          <button class="tab" data-tab="action">Action</button>
          <button class="tab active" data-tab="state">State</button>
          <button class="tab" data-tab="diff">Diff</button>
        </div>
        <div class="pane-head"><input id="detail-search" class="search" placeholder="Search keys / values…" /></div>
        <div class="scroll" id="detail"><div class="empty">Loading…</div></div>
      </div>
    </div>
    <script src="./panel.js"></script>
  </body>
</html>
